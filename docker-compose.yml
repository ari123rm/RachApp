services:
  postgres:
    image: postgres:16-alpine
    container_name: rachapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rachapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-rachapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rachapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rachapp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rachapp}?schema=public
      JWT_SECRET: ${JWT_SECRET:-rachapp_secret_key_change_me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      FIREBASE_SERVICE_ACCOUNT: ./firebase-service-account.json
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - rachapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: rachapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - rachapp-network

volumes:
  postgres_data:

networks:
  rachapp-network:
    driver: bridge
