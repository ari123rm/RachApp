name: Build Android APK & OTA Bundle

on:
  push:
    branches:
      - main
      - feature/backend
      - feature/full-integration
      - feature/fix-backend
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-version:
    name: 1. Definir Versão da Release
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Calcular TAG_NAME, VERSION_NAME e VERSION_CODE
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${RAW_TAG#v}"
            TAG_NAME="v${VERSION_NAME}"
          else
            VERSION_NAME="0.1.${{ github.run_number }}"
            TAG_NAME="v0.1.${{ github.run_number }}"
          fi
          VERSION_CODE=$((100 + ${{ github.run_number }}))

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "✅ Release configurada: TAG_NAME=${TAG_NAME} | VERSION_NAME=${VERSION_NAME} | VERSION_CODE=${VERSION_CODE}"

  build-web-ota:
    name: 2. Compilar Frontend Web & Pacote OTA
    needs: [prepare-version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        run: npm install --legacy-peer-deps

      - name: Injetar variáveis e compilar Frontend Web (Vite + SQLite WASM)
        env:
          RAW_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}
        run: |
          if [ -n "$RAW_API_URL" ]; then
            echo "VITE_API_URL=$RAW_API_URL" > .env.production
            echo "VITE_API_URL=$RAW_API_URL" > .env
            echo "✅ VITE_API_URL injetada no build do APK e OTA"
          else
            echo "⚠️ AVISO: Secret VITE_API_URL não encontrado! Configure VITE_API_URL nos Secrets do repositório."
          fi
          echo "VITE_APP_VERSION=${VERSION_NAME}" >> .env.production
          echo "VITE_APP_VERSION=${VERSION_NAME}" >> .env
          echo "✅ VITE_APP_VERSION=${VERSION_NAME} injetada no build"
          npm run build

      - name: Gerar pacote update.zip e manifesto version.json (OTA Self-Hosted)
        env:
          VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}
          TAG_NAME: ${{ needs.prepare-version.outputs.tag_name }}
        run: |
          mkdir -p ../apk-output

          (cd dist && zip -r -q ../../apk-output/update.zip .)
          OTA_CHECKSUM=$(sha256sum ../apk-output/update.zip | awk '{print $1}')
          echo "✅ Pacote OTA update.zip gerado com sucesso (SHA-256: ${OTA_CHECKSUM})"

          REPO="${{ github.repository }}"
          UPDATE_ZIP_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/update.zip"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/app-release.apk"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat <<EOF > ../apk-output/version.json
          {
            "version": "${VERSION_NAME}",
            "tagName": "${TAG_NAME}",
            "url": "${UPDATE_ZIP_URL}",
            "updateZipUrl": "${UPDATE_ZIP_URL}",
            "checksum": "${OTA_CHECKSUM}",
            "apkUrl": "${APK_URL}",
            "publishedAt": "${PUBLISHED_AT}"
          }
          EOF

          echo "✅ Manifesto version.json gerado:"
          cat ../apk-output/version.json

      - name: Salvar build Web (dist) para o job Android
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Salvar pacote OTA (update.zip + version.json)
        uses: actions/upload-artifact@v4
        with:
          name: ota-bundle-${{ github.run_id }}
          path: |
            apk-output/update.zip
            apk-output/version.json
          if-no-files-found: error
          retention-days: 5

  build-android-apk:
    name: 3. Compilar e Assinar APK Android (Capacitor + Gradle)
    needs: [prepare-version, build-web-ota]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Java JDK 21 (Capacitor 8 / AGP 8)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar dependências do Frontend
        run: npm install --legacy-peer-deps

      - name: Baixar build Web compilado (dist)
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: frontend/dist

      - name: Inicializar e Sincronizar Plataforma Android (Capacitor)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "🔧 Projeto Android não encontrado ou incompleto. Gerando com 'npx cap add android'..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

          if [ -f "capacitor-overrides/android/AndroidManifest.xml" ]; then
            cp -f capacitor-overrides/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml customizado aplicado"
          fi
          if [ -f "capacitor-overrides/android/MainActivity.java" ]; then
            mkdir -p android/app/src/main/java/com/ariel/rachapp
            cp -f capacitor-overrides/android/MainActivity.java android/app/src/main/java/com/ariel/rachapp/MainActivity.java
            echo "✅ MainActivity.java customizada aplicada"
          fi
          if [ -d "capacitor-overrides/android/res" ]; then
            mkdir -p android/app/src/main/res
            cp -rf capacitor-overrides/android/res/* android/app/src/main/res/
            echo "✅ Recursos nativos (res/xml) customizados aplicados"
          fi

          if [ -f "capacitor-overrides/android/google-services.json" ]; then
            cp -f capacitor-overrides/android/google-services.json android/app/google-services.json
            echo "✅ google-services.json aplicado com sucesso"
          elif [ -f "capacitor-overrides/google-services.json" ]; then
            cp -f capacitor-overrides/google-services.json android/app/google-services.json
            echo "✅ google-services.json aplicado com sucesso"
          fi

      - name: Aplicar ícone e Splash Screen no projeto Android
        run: |
          mkdir -p assets
          cp src/assets/icon.png assets/icon.png
          cp src/assets/icon.png assets/icon-only.png
          cp src/assets/icon.png assets/icon-foreground.png
          cp src/assets/splash.png assets/icon-background.png
          cp src/assets/splash.png assets/splash.png
          cp src/assets/splash.png assets/splash-dark.png

          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#05080f' \
            --iconBackgroundColorDark '#05080f' \
            --splashBackgroundColor '#05080f' \
            --splashBackgroundColorDark '#05080f' || true

          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            dir="android/app/src/main/res/$density"
            if [ -d "$dir" ]; then
              cp -f src/assets/icon.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp -f src/assets/icon.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp -f src/assets/icon.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png 2>/dev/null || true

      - name: Configurar network_security_config e Intents do WhatsApp
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_receipts" path="shared_receipts" />
              <cache-path name="cache_root" path="." />
              <external-cache-path name="ext_cache" path="." />
              <external-path name="ext_files" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          EOF

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/g' "$MANIFEST"
          fi

          if [ -f "$MANIFEST" ] && ! grep -q "com.whatsapp" "$MANIFEST"; then
            sed -i 's/<\/manifest>/<queries><package android:name="com.whatsapp" \/><package android:name="com.whatsapp.w4b" \/><intent><action android:name="android.intent.action.VIEW" \/><data android:scheme="whatsapp" \/><\/intent><intent><action android:name="android.intent.action.VIEW" \/><data android:scheme="https" \/><\/intent><\/queries><\/manifest>/g' "$MANIFEST"
          fi

      - name: Definir versionCode e versionName no build.gradle
        env:
          VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle
          echo "✅ Versão do APK definida para versionName=${VERSION_NAME} (versionCode=${VERSION_CODE})"

      - name: Compilar APK Release via Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Alinhar e Assinar APK com Keystore Fixa
        run: |
          mkdir -p ../apk-output

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks rachapp-keystore.jks \
            --ks-key-alias rachapp \
            --ks-pass pass:rachapp123 \
            --key-pass pass:rachapp123 \
            --out ../apk-output/app-release.apk \
            app-release-aligned.apk

          cp -f ../apk-output/app-release.apk ../apk-output/RachApp-release.apk

      - name: Salvar APKs assinados para publicação
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: |
            apk-output/app-release.apk
            apk-output/RachApp-release.apk
          if-no-files-found: error
          retention-days: 5

  publish-release:
    name: 4. Publicar Artefatos e Release no GitHub
    needs: [prepare-version, build-web-ota, build-android-apk]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.prepare-version.outputs.tag_name }}
      VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}

    steps:
      - name: Baixar pacote OTA (update.zip + version.json)
        uses: actions/download-artifact@v4
        with:
          name: ota-bundle-${{ github.run_id }}
          path: apk-output

      - name: Baixar APKs assinados (app-release.apk + RachApp-release.apk)
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: apk-output

      - name: Publicar pacote completo nos Artifacts do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: RachApp-Release-${{ env.TAG_NAME }}-${{ github.sha }}
          path: |
            apk-output/app-release.apk
            apk-output/RachApp-release.apk
            apk-output/update.zip
            apk-output/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release Automática no GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: "RachApp - ${{ env.TAG_NAME }} (${{ github.ref_name }})"
          body: |
            Release gerada automaticamente a partir do commit `${{ github.sha }}` na ref `${{ github.ref_name }}`.
            - **app-release.apk** / **RachApp-release.apk**: Instalador completo do Android (para novas instalações).
            - **update.zip**: Bundle web compilado para atualização automática em background (OTA Self-Hosted).
            - **version.json**: Manifesto de versão e URLs da release para checagem OTA.
          files: |
            apk-output/app-release.apk
            apk-output/RachApp-release.apk
            apk-output/update.zip
            apk-output/version.json
          draft: false
          prerelease: false
          make_latest: true
